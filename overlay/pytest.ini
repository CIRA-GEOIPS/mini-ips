; Written fresh rather than trimmed from upstream's, which carries a 30-marker
; taxonomy for a shell-script comparison harness this fork does not have, and
; whose `norecursedirs` silently excluded a whole test directory.
;
; Everything here must run with no satellite data, no network and no
; GEOIPS_TESTDATA_DIR. If a test needs any of those, it belongs upstream.

[pytest]
testpaths = tests
pythonpath = .
addopts = -q -ra --strict-markers
markers =
    ; Required, not decorative: the adapted DataTree suite imports
    ; xarray.tests, whose __init__ defines `flaky = pytest.mark.flaky` and
    ; `network = pytest.mark.network` at module scope. Without these two,
    ; --strict-markers turns collection of 158 tests into an error.
    flaky: upstream xarray marker, carried by the adapted DataTree tests
    network: upstream xarray marker, carried by the adapted DataTree tests
filterwarnings =
    default
    ; Upstream still uses classmethod @model_validator(mode="after"); pydantic
    ; 2.12 deprecated it. Not ours to fix, and noisy in every run.
    ignore:Using `@model_validator` with mode='after' on a classmethod:DeprecationWarning
    ; geoips/filenames/base_paths.py is a deprecated shim over geoips.config and
    ; warns on import. Upstream's own migration; we keep the shim because 61
    ; modules still import it.
    ignore:.*base_paths.*:DeprecationWarning
